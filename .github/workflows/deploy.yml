name: Deploy CA Sample

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          
          script: |
            set -e

            cd /root/CA-sample

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing frontend dependencies..."
            cd client
            npm install

            echo "Building frontend..."
            rm -rf .next
            npm run build

            echo "Installing backend dependencies..."
            cd ../server
            npm install

            echo "Current PM2 processes:"
            pm2 list || true

            echo "Restarting frontend..."
            if pm2 describe br-client > /dev/null 2>&1; then
              pm2 restart br-client --update-env
            elif pm2 describe ca-sample-client > /dev/null 2>&1; then
              pm2 restart ca-sample-client --update-env
            elif pm2 describe caproject-frontend > /dev/null 2>&1; then
              pm2 restart caproject-frontend --update-env
            else
              cd /root/CA-sample/client
              pm2 start npm --name br-client -- start
            fi

            echo "Restarting backend..."
            if pm2 describe br-server > /dev/null 2>&1; then
              pm2 restart br-server --update-env
            elif pm2 describe ca-sample-server > /dev/null 2>&1; then
              pm2 restart ca-sample-server --update-env
            elif pm2 describe caproject-backend > /dev/null 2>&1; then
              pm2 restart caproject-backend --update-env
            else
              cd /root/CA-sample/server
              pm2 start npm --name br-server -- start
            fi

            echo "Saving PM2..."
            pm2 save

            echo "✅ Deployment completed successfully."
